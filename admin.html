<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willpower Command Center v7.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px;}
        .sidebar { width: 260px; height: 100vh; position: fixed; top: 0; left: 0; background: #1a1d21; color: #fff; padding: 20px; overflow-y: auto; z-index: 1000; }
        .sidebar-brand { font-size: 1.2rem; font-weight: bold; padding-bottom: 20px; border-bottom: 1px solid #333; margin-bottom: 20px; color: #c5a059; }
        .nav-btn { display: block; width: 100%; text-align: left; padding: 12px 15px; margin-bottom: 8px; background: transparent; border: none; color: #aaa; border-radius: 6px; transition: 0.2s; }
        .nav-btn:hover { background: #333; color: #fff; }
        .nav-btn.active { background: #c5a059; color: #000; font-weight: 700; }
        .main-content { margin-left: 260px; padding: 40px; max-width: 1000px; }
        .editor-section { display: none; }
        .editor-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { border: none; box-shadow: 0 2px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-radius: 10px; }
        .card-header { background: #fff; border-bottom: 1px solid #eee; padding: 15px 20px; font-weight: 700; }
        label { font-size: 0.8rem; font-weight: 700; color: #555; text-transform: uppercase; margin-top: 15px; display: block; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #dee2e6; border-radius: 5px; }
        input[type="color"] { height: 50px; padding: 0; border: none; cursor: pointer; }
        .upload-group { display: flex; gap: 10px; align-items: flex-end; }
        .btn-upload { border: 2px dashed #c5a059; color: #c5a059; background: white; padding: 9px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; white-space: nowrap;}
        .action-bar { position: fixed; bottom: 0; left: 260px; right: 0; background: #fff; padding: 15px 40px; border-top: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; z-index: 900; }
        .btn-publish { background: #052b1e; color: #c5a059; border: none; padding: 10px 30px; font-weight: 700; border-radius: 5px; }
        .slide-block { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 15px; }
        .connection-status { padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }
        .status-connected { background-color: #d1e7dd; color: #0f5132; }
        .status-disconnected { background-color: #f8d7da; color: #842029; }
        #debug-console { display: none; position: fixed; top: 20px; right: 20px; width: 350px; background: rgba(0,0,0,0.9); color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.75rem; z-index: 2000; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-crown me-2"></i> Willpower v7.1</div>
    <button class="nav-btn active" onclick="showTab('settings')"><i class="fas fa-cog me-2"></i> 1. Setup</button>
    <button class="nav-btn" onclick="showTab('design')"><i class="fas fa-paint-brush me-2"></i> 2. Brand & Logo</button>
    <button class="nav-btn" onclick="showTab('home')"><i class="fas fa-home me-2"></i> 3. 5-Slide Hero</button>
    <button class="nav-btn" onclick="showTab('ventures')"><i class="fas fa-layer-group me-2"></i> 4. Ventures</button>
    <button class="nav-btn" onclick="showTab('contact')"><i class="fas fa-address-book me-2"></i> 5. Contact</button>
    <div style="margin-top: 50px; padding: 20px;"><button onclick="fullReset()" class="btn btn-sm btn-outline-danger w-100">Logout</button></div>
</div>

<div class="main-content">
    
    <div id="settings" class="editor-section active">
        <div id="auth-status" class="connection-status status-disconnected"><span>Not Connected</span></div>
        <div class="card"><div class="card-header">GitHub Credentials</div><div class="card-body">
            <label>Username</label><input type="text" id="gh_username">
            <label>Repo Name</label><input type="text" id="gh_repo" value="worldofwillpower">
            <label>Token</label><input type="password" id="gh_token">
            <button onclick="saveAuth()" class="btn btn-success mt-3 w-100 fw-bold">CONNECT & REMEMBER</button>
        </div></div>
        <div class="card"><div class="card-body"><label>Analytics ID</label><input type="text" id="ga_id"><label>Visitor Start</label><input type="number" id="base_visits" value="1500"></div></div>
    </div>

    <div id="design" class="editor-section">
        <div class="card"><div class="card-header">Branding Studio</div><div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <label>Company Name Text</label><input type="text" id="brand_name" value="World of Willpower">
                </div>
                <div class="col-md-6">
                    <label>Logo Image (Optional)</label>
                    <div class="upload-group"><input type="text" id="brand_logo_url" placeholder="Upload or Paste Link"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'brand_logo_url')"></div></div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label>Font Style</label>
                    <select id="brand_font">
                        <option value="'Cinzel', serif">Cinzel (Elegant/Corporate)</option>
                        <option value="'Montserrat', sans-serif">Montserrat (Modern/Clean)</option>
                        <option value="'Playfair Display', serif">Playfair (Luxury)</option>
                        <option value="'Roboto', sans-serif">Roboto (Standard)</option>
                        <option value="'Great Vibes', cursive">Great Vibes (Cursive)</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label>Font Size (px)</label>
                    <input type="number" id="brand_size" value="24">
                </div>
            </div>
        </div></div>

        <div class="card"><div class="card-header">Colors</div><div class="card-body"><div class="row">
            <div class="col-md-6"><label>Primary Color</label><input type="color" id="col_primary" value="#052b1e"></div>
            <div class="col-md-6"><label>Accent Color</label><input type="color" id="col_accent" value="#c5a059"></div>
        </div></div></div>
    </div>

    <div id="home" class="editor-section">
        <div class="card"><div class="card-header">Hero Slider (Leave empty to hide slide)</div><div class="card-body">
            <div class="slide-block"><h6>Slide 1 (Main)</h6><div class="upload-group"><input type="text" id="img_hero1"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'img_hero1')"></div></div><label>Title</label><input type="text" id="hero_h1"><label>Subtext</label><textarea id="hero_p1" rows="1"></textarea></div>
            <div class="slide-block"><h6>Slide 2</h6><div class="upload-group"><input type="text" id="img_hero2"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'img_hero2')"></div></div><label>Title</label><input type="text" id="hero_h2"><label>Subtext</label><textarea id="hero_p2" rows="1"></textarea></div>
            <div class="slide-block"><h6>Slide 3</h6><div class="upload-group"><input type="text" id="img_hero3"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'img_hero3')"></div></div><label>Title</label><input type="text" id="hero_h3"><label>Subtext</label><textarea id="hero_p3" rows="1"></textarea></div>
            <div class="slide-block"><h6>Slide 4</h6><div class="upload-group"><input type="text" id="img_hero4"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'img_hero4')"></div></div><label>Title</label><input type="text" id="hero_h4"><label>Subtext</label><textarea id="hero_p4" rows="1"></textarea></div>
            <div class="slide-block"><h6>Slide 5</h6><div class="upload-group"><input type="text" id="img_hero5"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'img_hero5')"></div></div><label>Title</label><input type="text" id="hero_h5"><label>Subtext</label><textarea id="hero_p5" rows="1"></textarea></div>
        </div></div>
        <div class="card"><div class="card-body"><label>About Text</label><textarea id="about_text" rows="4"></textarea></div></div>
        <div class="card"><div class="card-body"><label>Custom Title</label><input type="text" id="cust_title"><label>Custom Content</label><textarea id="cust_text" rows="3"></textarea></div></div>
    </div>

    <div id="ventures" class="editor-section">
        <div id="venture-container"></div>
        <button class="btn-add" onclick="addVenture()"><i class="fas fa-plus"></i> ADD NEW VENTURE</button>
    </div>

    <div id="contact" class="editor-section">
        <div class="card"><div class="card-header">Footer Details</div><div class="card-body">
            <label>Address</label><input type="text" id="address">
            <label>Email</label><input type="text" id="email">
            <label>WhatsApp</label><input type="text" id="whatsapp">
        </div></div>
    </div>
</div>

<div class="action-bar">
    <div id="status-text" style="color:#052b1e; font-weight:bold;"></div>
    <button class="btn-publish" onclick="publishToGitHub()"><i class="fas fa-rocket me-2"></i> PUBLISH CHANGES</button>
</div>

<div id="debug-console"></div>

<script>
    // --- STATE ---
    let auth = { gh_username: '', gh_repo: 'worldofwillpower', gh_token: '' };
    
    // YOUR CUSTOM DEFAULTS ARE HERE
    let content = {
        ga_id: '', base_visits: 1500, col_primary: '#052b1e', col_accent: '#c5a059',
        brand_name: 'World of Willpower', brand_logo_url: '', brand_font: "'Cinzel', serif", brand_size: '24',
        img_hero1: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1600&q=80', hero_h1: 'Forging Leaders.', hero_p1: 'Strategic mentorship for visionaries.',
        img_hero2: 'https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=1600&q=80', hero_h2: 'Manufacturing Quality.', hero_p2: 'Premium Dairy & Ayurvedic Standards.',
        img_hero3: '', hero_h3: '', hero_p3: '',
        img_hero4: '', hero_h4: '', hero_p4: '',
        img_hero5: '', hero_h5: '', hero_p5: '',
        about_text: 'World of Willpower is a diversified conglomerate...', cust_title: '', cust_text: '',
        
        // --- YOUR HARDCODED DETAILS ---
        address: '002, A Wing, Saj Shrushti Complex, Daighar, Thane, Maharashtra. 241 204', 
        email: 'care@worldofwillpower.com', 
        whatsapp: '917039196489',
        
        ventures: [ { title: "Mentoring", features: "Leadership Coaching\nPitch Deck" }, { title: "Dairy", features: "Cow Ghee\nOrganic Milk" } ]
    };

    window.onload = function() {
        const savedAuth = localStorage.getItem('wp_auth');
        if(savedAuth) { auth = JSON.parse(savedAuth); document.getElementById('gh_username').value = auth.gh_username; document.getElementById('gh_repo').value = auth.gh_repo; document.getElementById('gh_token').value = auth.gh_token; updateAuthStatus(true); }
        const savedContent = localStorage.getItem('wp_content_v7');
        if(savedContent) content = { ...content, ...JSON.parse(savedContent) };
        const fields = ['ga_id','base_visits','col_primary','col_accent','brand_name','brand_logo_url','brand_font','brand_size','img_hero1','hero_h1','hero_p1','img_hero2','hero_h2','hero_p2','img_hero3','hero_h3','hero_p3','img_hero4','hero_h4','hero_p4','img_hero5','hero_h5','hero_p5','about_text','cust_title','cust_text','address','email','whatsapp'];
        fields.forEach(f => { if(document.getElementById(f)) document.getElementById(f).value = content[f] || ''; });
        renderVentures();
    };

    function saveAuth() {
        auth.gh_username = document.getElementById('gh_username').value; auth.gh_repo = document.getElementById('gh_repo').value; auth.gh_token = document.getElementById('gh_token').value;
        if(!auth.gh_token) { alert('Missing Token'); return; }
        localStorage.setItem('wp_auth', JSON.stringify(auth)); updateAuthStatus(true); alert('Connected.');
    }
    function updateAuthStatus(c) { document.getElementById('auth-status').className = c ? "connection-status status-connected" : "connection-status status-disconnected"; document.getElementById('auth-status').innerHTML = c ? "Connected" : "Not Connected"; }
    function fullReset() { if(confirm('Disconnect?')) { localStorage.removeItem('wp_auth'); location.reload(); } }

    function saveContentState() {
        const fields = ['ga_id','base_visits','col_primary','col_accent','brand_name','brand_logo_url','brand_font','brand_size','img_hero1','hero_h1','hero_p1','img_hero2','hero_h2','hero_p2','img_hero3','hero_h3','hero_p3','img_hero4','hero_h4','hero_p4','img_hero5','hero_h5','hero_p5','about_text','cust_title','cust_text','address','email','whatsapp'];
        fields.forEach(f => { if(document.getElementById(f)) content[f] = document.getElementById(f).value; });
        localStorage.setItem('wp_content_v7', JSON.stringify(content));
        document.getElementById('status-text').innerText = "Autosaved";
    }

    function renderVentures() {
        const c = document.getElementById('venture-container'); c.innerHTML = '';
        content.ventures.forEach((v, i) => { c.innerHTML += `<div class="venture-item"><button class="btn-remove" onclick="removeVenture(${i})"><i class="fas fa-trash"></i></button><div class="row"><div class="col-md-4"><label>Title</label><input type="text" value="${v.title}" oninput="updateVenture(${i},'title',this.value)"></div><div class="col-md-8"><label>Features</label><textarea rows="3" oninput="updateVenture(${i},'features',this.value)">${v.features}</textarea></div></div></div>`; });
    }
    function addVenture() { content.ventures.push({ title: "New", features: "" }); renderVentures(); saveContentState(); }
    function removeVenture(i) { if(confirm('Delete?')) { content.ventures.splice(i, 1); renderVentures(); saveContentState(); } }
    function updateVenture(i, f, v) { content.ventures[i][f] = v; saveContentState(); }

    function showTab(id) { document.querySelectorAll('.editor-section').forEach(e=>e.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active')); document.getElementById(id).classList.add('active'); event.currentTarget.classList.add('active'); }
    function log(msg) { const c = document.getElementById('debug-console'); c.style.display='block'; c.innerHTML = `> ${msg}<br>` + c.innerHTML; setTimeout(()=>c.style.display='none', 8000); }
    function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }

    async function uploadImage(input, targetID) {
        const file = input.files[0]; if(!file || !auth.gh_token) return;
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = async function() {
            const contentBase64 = reader.result.split(',')[1];
            const filename = 'uploads/' + Date.now() + '_' + file.name.replace(/\s/g, '');
            try {
                log('Uploading...');
                const url = `https://api.github.com/repos/${auth.gh_username}/${auth.gh_repo}/contents/${filename}`;
                const res = await fetch(url, { method: 'PUT', headers: { 'Authorization': `token ${auth.gh_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ message: `Img`, content: contentBase64 }) });
                if(!res.ok) throw new Error('Failed');
                document.getElementById(targetID).value = `https://${auth.gh_username}.github.io/${auth.gh_repo}/${filename}`;
                saveContentState(); log('Uploaded');
            } catch(e) { alert('Upload Failed'); }
        };
    }

    async function publishToGitHub() {
        saveContentState();
        if(!auth.gh_token) { alert('Not Connected'); return; }
        document.getElementById('status-text').innerText = "Publishing...";

        let vHTML = '';
        content.ventures.forEach(v => {
            const items = v.features.split('\n').map(f => f.trim() ? `<li><i class="fas fa-check" style="color:${content.col_accent}; margin-right:10px;"></i> ${f}</li>` : '').join('');
            vHTML += `<div class="col-lg-4 col-md-6"><div class="venture-card" style="background:#fff; height:100%; box-shadow:0 10px 30px rgba(0,0,0,0.05); transition:0.3s; border-top:4px solid ${content.col_accent};"><div style="padding:30px;"><h3 style="color:${content.col_primary}; font-family:${content.brand_font}; margin-bottom:20px;">${v.title}</h3><ul style="list-style:none; padding:0; line-height:2;">${items}</ul></div></div></div>`;
        });

        // SLIDER LOGIC (1-5)
        let slideHTML = '';
        for(let i=1; i<=5; i++) {
            if(content[`img_hero${i}`]) {
                const active = i===1 ? 'active' : '';
                slideHTML += `<div class="carousel-item ${active}" style="background-image:url('${content[`img_hero${i}`]}')"><div class="overlay"></div><div class="carousel-caption" data-aos="fade-up"><h1>${content[`hero_h${i}`]}</h1><p class="lead text-white mb-5">${content[`hero_p${i}`]}</p></div></div>`;
            }
        }

        // BRAND LOGIC
        let brandHTML = '';
        if(content.brand_logo_url) {
            brandHTML = `<img src="${content.brand_logo_url}" style="height:50px; margin-right:10px;"> <span style="font-family:${content.brand_font}; font-size:${content.brand_size}px; color:${content.col_accent};">${content.brand_name}</span>`;
        } else {
            brandHTML = `<span style="font-family:${content.brand_font}; font-size:${content.brand_size}px; color:${content.col_accent}; font-weight:700;">${content.brand_name}</span>`;
        }

        // FOOTER COMPACT (15px padding)
        const footer = `<footer style="background-color:${content.col_primary}; color:#fff; padding:15px 0; text-align:center;"><div class="container"><div style="display:flex; justify-content:center; align-items:center; gap:20px; flex-wrap:wrap;"><h5 style="color:${content.col_accent}; margin:0;">${content.brand_name}</h5><div style="font-size:0.9rem;"><span><i class="fab fa-whatsapp" style="color:#25d366"></i> +${content.whatsapp}</span> <span style="margin-left:15px"><i class="fas fa-envelope" style="color:#f0ad4e"></i> ${content.email}</span></div><div style="font-size:0.7rem; border:1px solid ${content.col_accent}; padding:2px 8px; border-radius:10px; color:${content.col_accent}">Visitors: <span id="visit-count">...</span></div></div></div></footer>`;

        const commonStyle = `<style>:root{--primary:${content.col_primary};--gold:${content.col_accent}}body{font-family:'Manrope',sans-serif;background:#fff;color:#333;overflow-x:hidden}h1,h2,h3,.navbar-brand{font-family:'Cinzel',serif}.navbar{background:var(--primary);padding:10px 0;border-bottom:3px solid var(--gold)}.navbar-brand{display:flex;align-items:center}.nav-link{color:rgba(255,255,255,.8)!important;margin-left:15px;text-transform:uppercase;font-size:.85rem}.carousel-item{height:85vh;min-height:500px;background-size:cover;background-position:center}.carousel-caption{bottom:35%}.carousel-caption h1{font-size:3.5rem;color:var(--gold);text-shadow:2px 2px 10px rgba(0,0,0,.5)}.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,.3))}.btn-gold{background:var(--gold);color:var(--primary);padding:15px 40px;font-weight:800;text-decoration:none;display:inline-block;text-transform:uppercase}.float-wa{position:fixed;width:60px;height:60px;bottom:40px;right:40px;background:#25d366;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none; z-index:999}.page-header{background:linear-gradient(to bottom,rgba(0,0,0,.7),rgba(0,0,0,.7)),url('${content.img_hero2}');padding:150px 0 80px 0;text-align:center;color:white}.page-header h1{color:var(--gold);font-size:3.5rem}</style>`;

        const indexHTML = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${content.brand_name}</title><script async src="https://www.googletagmanager.com/gtag/js?id=${content.ga_id}"><\/script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','${content.ga_id}');<\/script><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Manrope:wght@300;400;600;800&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Roboto:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">${commonStyle}</head><body><nav class="navbar navbar-expand-lg navbar-dark fixed-top"><div class="container"><a class="navbar-brand" href="index.html">${brandHTML}</a><div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="ventures.html">Our Ventures</a></li><li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li></ul></div></div></nav><div class="carousel slide carousel-fade" data-bs-ride="carousel"><div class="carousel-inner">${slideHTML}</div></div><section style="padding:80px 0"><div class="container text-center" data-aos="fade-up"><h2 class="fw-bold text-uppercase mb-4" style="color:var(--primary)">The Ecosystem</h2><p class="lead text-muted" style="max-width:800px;margin:0 auto">${content.about_text}</p></div></section>${content.cust_title ? `<section style="background:#f4f4f4; padding:50px 0; text-align:center;"><h3>${content.cust_title}</h3><p>${content.cust_text}</p></section>` : ''}${footer}<a href="https://wa.me/${content.whatsapp}" class="float-wa" target="_blank"><i class="fab fa-whatsapp"></i></a><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"><\/script><script src="https://unpkg.com/aos@2.3.1/dist/aos.js"><\/script><script>AOS.init({duration:1000,once:true});let v=localStorage.getItem('site_visits')||${content.base_visits};v++;localStorage.setItem('site_visits',v);document.getElementById('visit-count').innerText=v;<\/script></body></html>`;

        async function updateFile(filename, content) {
            try {
                const url = `https://api.github.com/repos/${auth.gh_username}/${auth.gh_repo}/contents/${filename}`;
                log(`Connecting to ${filename}...`);
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${auth.gh_token}` }});
                if(!getRes.ok) throw new Error(getRes.status);
                const getData = await getRes.json();
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${auth.gh_token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `V7.1 Update: ${filename}`, content: utf8_to_b64(content), sha: getData.sha })
                });
                if(res.ok) log(filename + " Updated.");
            } catch(e) { log("Error: " + e.message); alert('Error: ' + e.message); }
        }

        await updateFile('index.html', indexHTML);
        await updateFile('ventures.html', venturesHTML);
