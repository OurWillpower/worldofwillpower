<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willpower Command Center v7.3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding-bottom: 100px; }
        
        /* Sidebar */
        .sidebar { width: 260px; height: 100vh; position: fixed; top: 0; left: 0; background: #1a1d21; color: #fff; padding: 20px; overflow-y: auto; z-index: 1000; }
        .sidebar-brand { font-size: 1.2rem; font-weight: bold; padding-bottom: 20px; border-bottom: 1px solid #333; margin-bottom: 20px; color: #c5a059; }
        .nav-btn { display: block; width: 100%; text-align: left; padding: 12px 15px; margin-bottom: 8px; background: transparent; border: none; color: #aaa; border-radius: 6px; transition: 0.2s; cursor: pointer; }
        .nav-btn:hover { background: #333; color: #fff; }
        .nav-btn.active { background: #c5a059; color: #000; font-weight: 700; }
        
        /* Main Content */
        .main-content { margin-left: 260px; padding: 40px; max-width: 1000px; }
        .editor-section { display: none; }
        .editor-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* UI Elements */
        .card { border: none; box-shadow: 0 2px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-radius: 10px; }
        .card-header { background: #fff; border-bottom: 1px solid #eee; padding: 15px 20px; font-weight: 700; }
        label { font-size: 0.8rem; font-weight: 700; color: #555; text-transform: uppercase; margin-top: 15px; display: block; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #dee2e6; border-radius: 5px; }
        input[type="color"] { height: 50px; padding: 0; border: none; cursor: pointer; }
        
        /* Buttons */
        .btn-success { background-color: #198754 !important; border-color: #198754 !important; }
        .btn-success:active { transform: scale(0.98); }
        
        .action-bar { position: fixed; bottom: 0; left: 260px; right: 0; background: #fff; padding: 15px 40px; border-top: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; z-index: 900; }
        .btn-publish { background: #052b1e; color: #c5a059; border: none; padding: 12px 30px; font-weight: 700; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .btn-publish:hover { background: #000; color: #fff; }
        .btn-publish:active { transform: scale(0.98); }

        /* Error Box */
        #crash-report { display: none; background: #dc3545; color: white; padding: 20px; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; text-align: center; }
        
        .connection-status { padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; text-align: center; }
        .status-disconnected { background-color: #f8d7da; color: #842029; }
        .status-connected { background-color: #d1e7dd; color: #0f5132; }
    </style>
</head>
<body>

<div id="crash-report">
    <h3>⚠️ System Error</h3>
    <p id="crash-msg">Unknown error.</p>
    <button class="btn btn-light btn-sm" onclick="localStorage.clear(); location.reload();">Hard Reset System</button>
</div>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-crown me-2"></i> Willpower v7.3</div>
    <button class="nav-btn active" onclick="switchTab('settings')"><i class="fas fa-cog me-2"></i> 1. Setup</button>
    <button class="nav-btn" onclick="switchTab('design')"><i class="fas fa-paint-brush me-2"></i> 2. Brand</button>
    <button class="nav-btn" onclick="switchTab('home')"><i class="fas fa-home me-2"></i> 3. Hero</button>
    <button class="nav-btn" onclick="switchTab('ventures')"><i class="fas fa-layer-group me-2"></i> 4. Ventures</button>
    <button class="nav-btn" onclick="switchTab('contact')"><i class="fas fa-address-book me-2"></i> 5. Contact</button>
    <div style="margin-top: 50px; padding: 20px;"><button onclick="fullReset()" class="btn btn-sm btn-outline-danger w-100">Logout</button></div>
</div>

<div class="main-content">
    
    <div id="settings" class="editor-section active">
        <div id="auth-status" class="connection-status status-disconnected">Not Connected</div>
        
        <div class="card"><div class="card-header">GitHub Credentials</div><div class="card-body">
            <label>Username</label><input type="text" id="gh_username">
            <label>Repo Name</label><input type="text" id="gh_repo" value="worldofwillpower">
            <label>Token (Password)</label><input type="password" id="gh_token" placeholder="Paste ghp_... code here">
            
            <button id="btn-connect" onclick="doConnect()" class="btn btn-success mt-3 w-100 fw-bold" style="height: 50px;">
                CONNECT & REMEMBER
            </button>
        </div></div>
    </div>

    <div id="design" class="editor-section">
        <div class="card"><div class="card-header">Branding</div><div class="card-body">
            <label>Company Name</label><input type="text" id="brand_name">
            <label>Font</label><select id="brand_font"><option value="'Cinzel', serif">Cinzel</option><option value="'Montserrat', sans-serif">Montserrat</option></select>
            <label>Colors</label>
            <div class="d-flex gap-3"><input type="color" id="col_primary" value="#052b1e"><input type="color" id="col_accent" value="#c5a059"></div>
        </div></div>
    </div>

    <div id="home" class="editor-section">
        <div class="card"><div class="card-header">Main Slide</div><div class="card-body">
            <label>Image Link</label><input type="text" id="img_hero1">
            <label>Title</label><input type="text" id="hero_h1">
            <label>Subtitle</label><input type="text" id="hero_p1">
        </div></div>
    </div>

    <div id="ventures" class="editor-section">
        <div id="venture-container"></div>
        <button class="btn btn-dark w-100 mt-3" onclick="addVenture()">+ Add Venture</button>
    </div>

    <div id="contact" class="editor-section">
        <div class="card"><div class="card-header">Contact</div><div class="card-body">
            <label>Address</label><input type="text" id="address">
            <label>Email</label><input type="text" id="email">
            <label>WhatsApp</label><input type="text" id="whatsapp">
        </div></div>
    </div>
</div>

<div class="action-bar">
    <div id="status-text" class="fw-bold text-success"></div>
    <button onclick="publishToGitHub()" class="btn-publish">PUBLISH CHANGES</button>
</div>

<script>
    // --- SAFE EXECUTION WRAPPER ---
    window.onerror = function(msg, url, line) {
        document.getElementById('crash-report').style.display = 'block';
        document.getElementById('crash-msg').innerText = `Error: ${msg} (Line ${line})`;
    };

    // --- DATA ---
    let auth = { gh_username: '', gh_repo: 'worldofwillpower', gh_token: '' };
    
    // DEFAULT DATA
    let content = {
        col_primary: '#052b1e', col_accent: '#c5a059',
        brand_name: 'World of Willpower', brand_font: "'Cinzel', serif",
        img_hero1: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1600&q=80',
        hero_h1: 'Forging Leaders.', hero_p1: 'Strategic mentorship.',
        address: '002, A Wing, Saj Shrushti Complex, Daighar, Thane, Maharashtra. 241 204',
        email: 'care@worldofwillpower.com', whatsapp: '917039196489',
        ventures: [{ title: "Mentoring", features: "Coaching\nStrategy" }]
    };

    // --- STARTUP ---
    document.addEventListener('DOMContentLoaded', () => {
        try {
            // 1. Load Auth
            const savedAuth = localStorage.getItem('wp_auth');
            if(savedAuth) {
                auth = JSON.parse(savedAuth);
                document.getElementById('gh_username').value = auth.gh_username || '';
                document.getElementById('gh_repo').value = auth.gh_repo || '';
                document.getElementById('gh_token').value = auth.gh_token || '';
                if(auth.gh_token) setConnectedUI(true);
            }

            // 2. Load Content
            const savedContent = localStorage.getItem('wp_content_v7');
            if(savedContent) content = { ...content, ...JSON.parse(savedContent) };
            
            // 3. Populate Inputs
            const ids = ['col_primary','col_accent','brand_name','brand_font','img_hero1','hero_h1','hero_p1','address','email','whatsapp'];
            ids.forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = content[id] || ''; });

            renderVentures();
        } catch(e) {
            console.error(e);
            alert("Data reset required. Click OK to fix.");
            localStorage.clear();
            location.reload();
        }
    });

    // --- FUNCTIONS ---
    function doConnect() {
        auth.gh_username = document.getElementById('gh_username').value;
        auth.gh_repo = document.getElementById('gh_repo').value;
        auth.gh_token = document.getElementById('gh_token').value;
        
        if(!auth.gh_token) { alert("Please enter a Token!"); return; }
        
        localStorage.setItem('wp_auth', JSON.stringify(auth));
        setConnectedUI(true);
        alert("Connected! Credentials saved.");
    }

    function setConnectedUI(isConnected) {
        const status = document.getElementById('auth-status');
        if(isConnected) {
            status.className = "connection-status status-connected";
            status.innerText = "CONNECTED ✅";
            document.getElementById('btn-connect').innerText = "CREDENTIALS SAVED";
            document.getElementById('btn-connect').classList.remove('btn-success');
            document.getElementById('btn-connect').classList.add('btn-secondary');
        } else {
            status.className = "connection-status status-disconnected";
            status.innerText = "NOT CONNECTED ❌";
        }
    }

    function fullReset() {
        if(confirm("Logout and clear all saved keys?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function switchTab(id) {
        document.querySelectorAll('.editor-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        // Find button that triggered this
        const btns = document.getElementsByTagName('button');
        for(let b of btns) { if(b.getAttribute('onclick') == `switchTab('${id}')`) b.classList.add('active'); }
    }

    // --- CONTENT LOGIC ---
    function saveInternal() {
        const ids = ['col_primary','col_accent','brand_name','brand_font','img_hero1','hero_h1','hero_p1','address','email','whatsapp'];
        ids.forEach(id => { if(document.getElementById(id)) content[id] = document.getElementById(id).value; });
        localStorage.setItem('wp_content_v7', JSON.stringify(content));
    }

    function renderVentures() {
        const c = document.getElementById('venture-container');
        c.innerHTML = '';
        content.ventures.forEach((v, i) => {
            c.innerHTML += `
            <div class="card"><div class="card-body">
                <div class="d-flex justify-content-between"><h6>Venture ${i+1}</h6><button class="btn btn-sm btn-danger" onclick="delVenture(${i})">X</button></div>
                <label>Title</label><input type="text" value="${v.title}" oninput="updVenture(${i},'title',this.value)">
                <label>Features</label><textarea rows="2" oninput="updVenture(${i},'features',this.value)">${v.features}</textarea>
            </div></div>`;
        });
    }
    function addVenture() { content.ventures.push({title:"New", features:""}); renderVentures(); saveInternal(); }
    function delVenture(i) { content.ventures.splice(i,1); renderVentures(); saveInternal(); }
    function updVenture(i, k, v) { content.ventures[i][k] = v; saveInternal(); }

    function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }

    // --- PUBLISH ---
    async function publishToGitHub() {
        saveInternal();
        const stat = document.getElementById('status-text');
        
        if(!auth.gh_token) { alert("Not Connected! Go to Setup."); switchTab('settings'); return; }
        
        stat.innerText = "⏳ Publishing...";
        
        // --- GENERATE HTML ---
        // Compact Footer + Colors
        const footer = `<footer style="background-color:${content.col_primary}; color:#fff; padding:15px 0; text-align:center;"><div class="container"><h4 style="color:${content.col_accent}; margin-bottom:5px;">${content.brand_name}</h4><p style="font-size:0.9rem; margin-bottom:10px;">${content.address}</p><div style="font-size:0.9rem; margin-bottom:10px;"><span><i class="fab fa-whatsapp" style="color:#25d366"></i> +${content.whatsapp}</span> <span style="margin-left:15px"><i class="fas fa-envelope" style="color:#f0ad4e"></i> ${content.email}</span></div><p class="small" style="opacity:0.7">&copy; 2025 World of Willpower.</p></div></footer>`;
        
        const style = `<style>:root{--primary:${content.col_primary};--gold:${content.col_accent}}body{font-family:'Manrope',sans-serif}h1,h2,h3,.navbar-brand{font-family:${content.brand_font}}.navbar{background:var(--primary);padding:10px 0;border-bottom:3px solid var(--gold)}.navbar-brand{color:var(--gold)!important;font-weight:700;font-size:1.4rem}.btn-gold{background:var(--gold);color:var(--primary);padding:15px 30px;text-decoration:none;display:inline-block;font-weight:bold}.carousel-item{height:85vh;min-height:500px;background-size:cover;background-position:center}.carousel-caption{bottom:35%}.carousel-caption h1{font-size:3.5rem;color:var(--gold);text-shadow:2px 2px 10px rgba(0,0,0,.5)}.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,.3))}.float-wa{position:fixed;width:60px;height:60px;bottom:40px;right:40px;background:#25d366;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none;z-index:999}</style>`;

        let vHTML = '';
        content.ventures.forEach(v => {
            const list = v.features.split('\n').map(f => `<li><i class="fas fa-check" style="color:${content.col_accent}; margin-right:8px;"></i>${f}</li>`).join('');
            vHTML += `<div class="col-lg-4 col-md-6 mb-4"><div style="background:#fff; box-shadow:0 5px 15px rgba(0,0,0,0.05); border-top:4px solid ${content.col_accent}; padding:30px; height:100%;"><h3 style="color:${content.col_primary};">${v.title}</h3><ul style="list-style:none; padding:0; line-height:2;">${list}</ul></div></div>`;
        });

        const indexHTML = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${content.brand_name}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Manrope:wght@300;400;600&family=Montserrat&display=swap" rel="stylesheet">${style}</head><body><nav class="navbar navbar-expand-lg navbar-dark fixed-top"><div class="container"><a class="navbar-brand" href="index.html">${content.brand_name}</a></div></nav><div class="carousel slide"><div class="carousel-inner"><div class="carousel-item active" style="background-image:url('${content.img_hero1}')"><div class="overlay"></div><div class="carousel-caption"><h1>${content.hero_h1}</h1><p class="lead text-white mb-4">${content.hero_p1}</p><a href="ventures.html" class="btn-gold">Explore</a></div></div></div></div><section style="padding:80px 0"><div class="container text-center"><h2 style="color:var(--primary)">Our Ecosystem</h2></div></section>${footer}<a href="https://wa.me/${content.whatsapp}" class="float-wa" target="_blank"><i class="fab fa-whatsapp"></i></a></body></html>`;
        
        const venturesHTML = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ventures</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Manrope:wght@300;400;600&family=Montserrat&display=swap" rel="stylesheet">${style}</head><body><nav class="navbar navbar-expand-lg navbar-dark fixed-top"><div class="container"><a class="navbar-brand" href="index.html">${content.brand_name}</a></div></nav><div style="padding:150px 0 50px 0; background:${content.col_primary}; color:white; text-align:center;"><h1>Our Ventures</h1></div><section style="padding:80px 0"><div class="container"><div class="row">${vHTML}</div></div></section>${footer}</body></html>`;

        // --- UPLOAD ---
        try {
            await uploadToGH('index.html', indexHTML);
            await uploadToGH('ventures.html', venturesHTML);
            stat.innerText = "✅ PUBLISHED SUCCESSFULLY";
            alert("Website Updated! Please wait 60 seconds then refresh your site.");
        } catch(e) {
            stat.innerText = "❌ ERROR";
            alert("Error: " + e.message);
        }
    }

    async function uploadToGH(file, content) {
        const url = `https://api.github.com/repos/${auth.gh_username}/${auth.gh_repo}/contents/${file}`;
        const get = await fetch(url, { headers: { 'Authorization': `token ${auth.gh_token}` }});
        const sha = get.ok ? (await get.json()).sha : null;
        
        const res = await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${auth.gh_token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'Update via Admin', content: utf8_to_b64(content), sha: sha })
        });
        if(!res.ok) throw new Error(`GitHub rejected upload (${res.status})`);
    }
</script>
</body>
</html>
