<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willpower Command Center v12.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding-bottom: 100px; }
        .sidebar { width: 260px; height: 100vh; position: fixed; top: 0; left: 0; background: #0f172a; color: #fff; padding: 20px; overflow-y: auto; z-index: 1000; border-right: 1px solid #1e293b; }
        .nav-btn { display: block; width: 100%; text-align: left; padding: 12px 15px; margin-bottom: 8px; background: transparent; border: none; color: #94a3b8; border-radius: 6px; transition: 0.2s; font-weight: 500; cursor: pointer; }
        .nav-btn:hover { background: #1e293b; color: #fff; }
        .nav-btn.active { background: #f59e0b; color: #000; font-weight: 700; }
        .main-content { margin-left: 260px; padding: 40px; max-width: 1200px; }
        .editor-section { display: none; animation: fadeIn 0.3s; }
        .editor-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; border-radius: 12px; }
        .card-header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 20px; font-weight: 700; color: #334155; }
        
        /* STYLE TOOLBAR */
        .style-toolbar { background: #f8fafc; padding: 10px; border: 1px solid #cbd5e1; border-bottom: none; border-radius: 8px 8px 0 0; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
        .style-toolbar select { width: auto; padding: 5px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 4px; }
        .style-toolbar input[type="number"] { width: 60px; padding: 5px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 4px; }
        .style-btn { border: 1px solid #cbd5e1; background: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; min-width: 35px; }
        .style-btn.active { background: #0f172a; color: white; border-color: #0f172a; }
        .style-btn:hover { background: #e2e8f0; }
        .styled-input { border-radius: 0 0 8px 8px; border-top: 1px solid #cbd5e1; }

        input[type="text"], textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .btn-publish { background: #0f172a; color: #f59e0b; border: none; padding: 12px 40px; font-weight: 800; border-radius: 8px; cursor: pointer; letter-spacing: 1px; width: 100%; }
        .venture-item { border: 1px solid #cbd5e1; background: #fff; margin-bottom: 30px; border-radius: 8px; overflow: hidden; position: relative; }
        .venture-header { background: #f1f5f9; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-upload { border: 2px dashed #94a3b8; background: #fff; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .upload-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .upload-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }
        .status-connected { background-color: #dcfce7; color: #166534; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .status-disconnected { background-color: #fee2e2; color: #991b1b; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .img-preview { height: 40px; border-radius: 4px; border: 1px solid #ddd; display: none; margin-left: 10px; vertical-align: middle; }
        #debug-console { display: none; position: fixed; top: 20px; right: 20px; width: 350px; background: rgba(15, 23, 42, 0.95); color: #4ade80; padding: 20px; border-radius: 12px; font-family: monospace; font-size: 0.75rem; z-index: 2000; }
        
        #autosave-indicator { font-size: 0.8rem; color: #64748b; font-weight: bold; margin-right: 15px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h4 style="color:#f59e0b; padding-bottom:20px; border-bottom:1px solid #333; margin-bottom:20px;"><i class="fas fa-crown me-2"></i> Willpower v12.1</h4>
    <button class="nav-btn active" onclick="switchTab('settings')">1. Setup</button>
    <button class="nav-btn" onclick="switchTab('design')">2. Brand & Style</button>
    <button class="nav-btn" onclick="switchTab('home')">3. Home Page</button>
    <button class="nav-btn" onclick="switchTab('ventures')">4. Microsite Builder</button>
    <button class="nav-btn" onclick="switchTab('contact')">5. Contact</button>
    <button onclick="if(confirm('Logout?')) { localStorage.clear(); location.reload(); }" class="btn btn-sm btn-outline-danger w-100 mt-5">Logout</button>
</div>

<div class="main-content">
    
    <div id="settings" class="editor-section active">
        <div id="auth-status" class="status-disconnected">Not Connected</div>
        <div class="card"><div class="card-header">GitHub Credentials</div><div class="card-body">
            <label>Username</label><input type="text" id="gh_username">
            <label>Repo Name</label><input type="text" id="gh_repo" value="worldofwillpower">
            <label>Token</label><input type="password" id="gh_token" placeholder="Paste Token here">
            <button onclick="saveAuth()" class="btn btn-success mt-3 w-100 fw-bold">CONNECT & REMEMBER</button>
        </div></div>
    </div>

    <div id="design" class="editor-section">
        <div class="card"><div class="card-header">Global Branding</div><div class="card-body">
            <div class="row">
                <div class="col-md-6"><label>Company Name</label><input type="text" id="brand_name" oninput="saveInternal()"></div>
                <div class="col-md-6"><label>Logo URL</label><div class="d-flex gap-2"><input type="text" id="brand_logo_url" oninput="saveInternal()"><div class="upload-wrapper"><button class="btn-upload">Up</button><input type="file" onchange="uploadImage(this, 'brand_logo_url')"></div></div></div>
            </div>
            <div class="row mt-3">
                <div class="col-md-6"><label>Font</label><select id="brand_font" onchange="saveInternal()"><option value="'Cinzel', serif">Cinzel</option><option value="'Montserrat', sans-serif">Montserrat</option></select></div>
                <div class="col-md-6"><label>Colors</label><div class="d-flex gap-3"><input type="color" id="col_primary" oninput="saveInternal()"><input type="color" id="col_accent" oninput="saveInternal()"></div></div>
            </div>
        </div></div>
    </div>

    <div id="home" class="editor-section">
        <div class="card"><div class="card-header">Hero Slider</div><div class="card-body">
            <label>Image</label><div class="d-flex gap-2"><input type="text" id="img_hero1" oninput="saveInternal()"><div class="upload-wrapper"><button class="btn-upload">Up</button><input type="file" onchange="uploadImage(this, 'img_hero1')"></div></div>
            
            <label>Title</label><div id="tool_hero_h1"></div><input type="text" id="hero_h1" class="styled-input" oninput="saveInternal()">
            <label>Subtitle</label><div id="tool_hero_p1"></div><input type="text" id="hero_p1" class="styled-input" oninput="saveInternal()">
        </div></div>

        <div class="card"><div class="card-body">
            <label>About Text</label><div id="tool_about_text"></div><textarea id="about_text" rows="4" class="styled-input" oninput="saveInternal()"></textarea>
        </div></div>
    </div>

    <div id="ventures" class="editor-section">
        <div id="venture-container"></div>
        <button class="btn btn-dark w-100 mt-3 p-3" onclick="addVenture()">+ ADD NEW BUSINESS</button>
    </div>

    <div id="contact" class="editor-section">
        <div class="card"><div class="card-header">Contact</div><div class="card-body">
            <label>Address</label><input type="text" id="address" oninput="saveInternal()">
            <label>Email</label><input type="text" id="email" oninput="saveInternal()">
            <label>WhatsApp</label><input type="text" id="whatsapp" oninput="saveInternal()">
        </div></div>
    </div>
</div>

<div class="action-bar">
    <span id="autosave-indicator"></span>
    <button onclick="publishToGitHub()" class="btn-publish"><i class="fas fa-rocket"></i> GENERATE & PUBLISH</button>
</div>

<div id="debug-console"></div>

<script>
    // --- FONT LIST ---
    const FONTS = ["Roboto", "Open Sans", "Lato", "Montserrat", "Poppins", "Playfair Display", "Merriweather", "Cinzel", "Raleway", "Nunito"];

    // --- DEFAULT DATA ---
    let auth = { gh_username: '', gh_repo: 'worldofwillpower', gh_token: '' };
    let content = {
        col_primary: '#0f172a', col_accent: '#f59e0b',
        brand_name: 'World of Willpower', brand_logo_url: '',
        img_hero1: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1600&q=80',
        hero_h1: 'Forging Leaders.', hero_p1: 'Strategic mentorship.',
        about_text: 'World of Willpower is a diversified conglomerate...',
        address: '002, A Wing, Saj Shrushti Complex, Daighar, Thane, Maharashtra. 241 204',
        email: 'care@worldofwillpower.com', whatsapp: '917039196489',
        ventures: [{ title: "Dairy Manufacturing", image: "", tagline: "Purity You Can Trust.", overview: "Overview text...", features: "Ghee\nPaneer" }],
        
        style_hero_h1: { font: 'Cinzel', size: '64', align: 'center', b: true, i: false, u: false },
        style_hero_p1: { font: 'Montserrat', size: '24', align: 'center', b: false, i: false, u: false },
        style_about_text: { font: 'Roboto', size: '18', align: 'center', b: false, i: false, u: false }
    };

    // --- INIT ---
    document.addEventListener('DOMContentLoaded', () => {
        // Load Auth (Master)
        const savedAuth = localStorage.getItem('willpower_master_auth');
        if(savedAuth) { auth = JSON.parse(savedAuth); document.getElementById('gh_username').value = auth.gh_username; document.getElementById('gh_repo').value = auth.gh_repo; document.getElementById('gh_token').value = auth.gh_token; if(auth.gh_token) setConnectedUI(true); }
        
        // Load Content (Master)
        const savedContent = localStorage.getItem('willpower_master_data');
        if(savedContent) {
            content = { ...content, ...JSON.parse(savedContent) }; 
        } else {
            // DATA RESCUE: Try to recover from v12 or v11
            const rescue = localStorage.getItem('wp_content_v12') || localStorage.getItem('wp_content_v11');
            if(rescue) { content = { ...content, ...JSON.parse(rescue) }; console.log("Data Rescued!"); }
        }
        
        renderToolbar('hero_h1'); renderToolbar('hero_p1'); renderToolbar('about_text');
        populateFields();
        renderVentures();
        
        // Start Auto-Save Loop
        setInterval(() => { saveInternal(false); }, 5000);
    });

    // --- TOOLBAR RENDERER ---
    function renderToolbar(id) {
        const container = document.getElementById('tool_' + id);
        if(!container) return;
        if(!content[`style_${id}`]) content[`style_${id}`] = { font: 'Roboto', size: '16', align: 'left', b: false, i: false, u: false };
        const s = content[`style_${id}`];
        const fontOptions = FONTS.map(f => `<option value="${f}" ${s.font===f?'selected':''}>${f}</option>`).join('');
        container.innerHTML = `
        <div class="style-toolbar">
            <select onchange="updateStyle('${id}', 'font', this.value)">${fontOptions}</select>
            <input type="number" value="${s.size}" onchange="updateStyle('${id}', 'size', this.value)" title="Size (px)">
            <button class="style-btn ${s.b?'active':''}" onclick="toggleStyle('${id}', 'b')"><b>B</b></button>
            <button class="style-btn ${s.i?'active':''}" onclick="toggleStyle('${id}', 'i')"><i>I</i></button>
            <button class="style-btn ${s.u?'active':''}" onclick="toggleStyle('${id}', 'u')"><u>U</u></button>
            <div style="border-left:1px solid #ccc; height:20px; margin:0 5px;"></div>
            <button class="style-btn ${s.align==='left'?'active':''}" onclick="updateStyle('${id}', 'align', 'left')"><i class="fas fa-align-left"></i></button>
            <button class="style-btn ${s.align==='center'?'active':''}" onclick="updateStyle('${id}', 'align', 'center')"><i class="fas fa-align-center"></i></button>
            <button class="style-btn ${s.align==='right'?'active':''}" onclick="updateStyle('${id}', 'align', 'right')"><i class="fas fa-align-right"></i></button>
        </div>`;
    }
    function updateStyle(id, key, val) { content[`style_${id}`][key] = val; renderToolbar(id); saveInternal(); }
    function toggleStyle(id, key) { content[`style_${id}`][key] = !content[`style_${id}`][key]; renderToolbar(id); saveInternal(); }

    function populateFields() {
        const ids = ['col_primary','col_accent','brand_name','brand_logo_url','img_hero1','hero_h1','hero_p1','about_text','address','email','whatsapp'];
        ids.forEach(id => { 
            if(document.getElementById(id)) {
                document.getElementById(id).value = content[id] || ''; 
                if(id.includes('logo') || id.includes('img')) showPreview(id, content[id]);
            }
        });
    }

    function showPreview(id, url) { const p = document.getElementById('prev_'+id); if(p && url) { p.src = url; p.style.display = 'inline-block'; } }
    function saveAuth() { auth.gh_username = document.getElementById('gh_username').value; auth.gh_repo = document.getElementById('gh_repo').value; auth.gh_token = document.getElementById('gh_token').value; localStorage.setItem('willpower_master_auth', JSON.stringify(auth)); setConnectedUI(true); alert("Connected!"); }
    function setConnectedUI(c) { document.getElementById('auth-status').className = c ? "status-connected" : "status-disconnected"; document.getElementById('auth-status').innerText = c ? "CONNECTED ✅" : "NOT CONNECTED ❌"; }
    function switchTab(id) { document.querySelectorAll('.editor-section').forEach(el => el.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active')); document.getElementById(id).classList.add('active'); event.currentTarget.classList.add('active'); }

    // --- VENTURE UI ---
    function renderVentures() {
        const c = document.getElementById('venture-container'); c.innerHTML = '';
        content.ventures.forEach((v, i) => {
            c.innerHTML += `
            <div class="venture-item">
                <div class="venture-header"><h5 class="m-0">Business ${i+1}: ${v.title}</h5><button class="btn btn-outline-danger btn-sm" onclick="delVenture(${i})">Delete</button></div>
                <div class="venture-body">
                    <div class="row mb-3"><div class="col-md-6"><label>Business Name</label><input type="text" value="${v.title}" oninput="updVenture(${i},'title',this.value)"></div><div class="col-md-6"><label>Hero Image</label><div class="d-flex gap-2"><input type="text" value="${v.image}" id="v_img_${i}" oninput="updVenture(${i},'image',this.value)"><div class="upload-wrapper"><button class="btn-upload">Up</button><input type="file" onchange="uploadImage(this, 'v_img_${i}', ${i})"></div></div></div></div><label>Tagline</label><input type="text" value="${v.tagline||''}" oninput="updVenture(${i},'tagline',this.value)"><label>Business Overview</label><textarea rows="4" oninput="updVenture(${i},'overview',this.value)">${v.overview||''}</textarea><label>Services (One per line)</label><textarea rows="5" oninput="updVenture(${i},'features',this.value)">${v.features}</textarea></div></div>`;
        });
    }
    function addVenture() { content.ventures.push({title:"New Business", image:"", features:"", overview:"", tagline:""}); renderVentures(); saveInternal(); }
    function delVenture(i) { if(confirm("Delete?")) { content.ventures.splice(i,1); renderVentures(); saveInternal(); } }
    function updVenture(i, k, v) { content.ventures[i][k] = v; if(k==='image') content.ventures[i]['image']=v; saveInternal(); }
    
    // --- MASTER SAVE ---
    function saveInternal(manual) {
        const ids = ['col_primary','col_accent','brand_name','brand_logo_url','img_hero1','hero_h1','hero_p1','about_text','address','email','whatsapp'];
        ids.forEach(id => { if(document.getElementById(id)) content[id] = document.getElementById(id).value; });
        localStorage.setItem('willpower_master_data', JSON.stringify(content));
        
        const now = new Date();
        document.getElementById('autosave-indicator').innerText = "Last saved: " + now.toLocaleTimeString();
        if(manual) alert("Draft Saved Successfully!");
    }

    function getStyleString(s) {
        if(!s) return '';
        return `font-family:'${s.font}', sans-serif; font-size:${s.size}px; text-align:${s.align}; font-weight:${s.b?'bold':'normal'}; font-style:${s.i?'italic':'normal'}; text-decoration:${s.u?'underline':'none'};`;
    }

    async function publishToGitHub() {
        saveInternal(false);
        if(!auth.gh_token) { alert("Not Connected!"); return; }
        const logBox = document.getElementById('debug-console'); logBox.style.display='block'; logBox.innerText="Generating Styles...";

        const fontLink = `<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@300;400;700&family=Nunito:wght@300;400;700&family=Open+Sans:wght@300;400;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;700&family=Raleway:wght@300;400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">`;
        const commonCSS = `<style>:root{--primary:${content.col_primary};--gold:${content.col_accent}} body{font-family:'Roboto',sans-serif; overflow-x:hidden} .navbar{background:var(--primary);padding:15px 5%;border-bottom:3px solid var(--gold)} .navbar-brand{font-family:'Cinzel'; color:var(--gold)!important; font-size:24px; font-weight:700} .nav-link{color:rgba(255,255,255,0.9)!important; text-transform:uppercase; font-size:0.85rem; letter-spacing:1px; margin-left:20px} footer{background:var(--primary);color:#fff;padding:40px 5%;text-align:center} .btn-gold{background:var(--gold);color:var(--primary);padding:15px 35px;font-weight:800;text-decoration:none;display:inline-block;text-transform:uppercase} .float-wa{position:fixed;bottom:30px;right:30px;background:#25d366;color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:999}</style>`;
        
        const footer = `<footer><h4>${content.brand_name}</h4><p class="mt-3">${content.address}</p><div class="mt-3 fs-5"><i class="fab fa-whatsapp text-success me-2"></i> +${content.whatsapp}</div></footer>`;
        let dropdown = ''; content.ventures.forEach(v => { const slug=v.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html'; dropdown+=`<li><a class="dropdown-item" href="${slug}">${v.title}</a></li>`; });
        let brandHTML = content.brand_logo_url ? `<img src="${content.brand_logo_url}" style="height:50px; margin-right:15px;">` : '';
        brandHTML += `<span>${content.brand_name}</span>`;
        const navbar = `<nav class="navbar navbar-expand-lg navbar-dark fixed-top"><div class="container-fluid"><a class="navbar-brand" href="index.html">${brandHTML}</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item dropdown"><a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Our Ventures</a><ul class="dropdown-menu">${dropdown}</ul></li><li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li></ul></div></div></nav>`;

        try {
            // INDEX
            let homeCards = '';
            content.ventures.forEach(v => { const slug = v.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.html'; homeCards += `<div class="col-lg-4 col-md-6 mb-4"><a href="${slug}" style="text-decoration:none; color:inherit;"><div style="background:#fff; border-top:4px solid ${content.col_accent}; padding:30px; box-shadow:0 10px 30px rgba(0,0,0,0.05); height:100%; transition:0.3s;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'"><h3 style="color:${content.col_primary}; font-family:'Cinzel'; text-align:center;">${v.title}</h3><p class="text-muted mt-3 text-center">${v.tagline || 'Click to explore'}</p><div style="color:${content.col_accent}; font-weight:bold; margin-top:20px; text-align:center;">View Details &rarr;</div></div></a></div>`; });
            
            const heroH1Style = getStyleString(content.style_hero_h1);
            const heroP1Style = getStyleString(content.style_hero_p1);
            const aboutStyle = getStyleString(content.style_about_text);

            const indexHTML = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${content.brand_name}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">${fontLink}<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">${commonCSS}</head><body>${navbar}<div style="height:90vh; background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('${content.img_hero1}'); background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; text-align:center; color:white; padding-top:80px;"><div class="container"><h1 style="${heroH1Style}">${content.hero_h1}</h1><p style="${heroP1Style} margin-top:20px;">${content.hero_p1}</p></div></div><section style="padding:100px 5%"><div class="container"><div style="${aboutStyle} max-width:900px; margin:0 auto;">${content.about_text}</div></div></section><section style="padding:0 5% 100px 5%; background:#f8f9fa;"><div class="container"><h2 class="text-center mb-5" style="color:${content.col_primary}; font-family:'Cinzel'; padding-top:50px;">Business Verticals</h2><div class="row">${homeCards}</div></div></section>${footer}<a href="https://wa.me/${content.whatsapp}" class="float-wa"><i class="fab fa-whatsapp"></i></a><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"><\/script></body></html>`;
            await uploadToGH('index.html', indexHTML);

            // MICROSITES
            for (const v of content.ventures) {
                const slug = v.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.html';
                const features = v.features.split('\n').map(f => { if(!f.trim()) return ''; return `<div class="col-md-6 col-lg-4 mb-4"><div style="background:white; padding:25px; border-radius:8px; border-left:5px solid ${content.col_accent}; box-shadow:0 5px 15px rgba(0,0,0,0.05); height:100%"><h5 style="color:${content.col_primary}; margin-bottom:10px; text-align:center;">${f}</h5></div></div>`; }).join('');
                const pageHTML = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${v.title}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">${fontLink}<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">${commonCSS}</head><body>${navbar}<div style="padding:150px 0 100px 0; background:linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.7)),url('${v.image}'); background-size:cover; text-align:center; color:white;"><h1>${v.title}</h1><p class="lead mt-3" style="color:${content.col_accent}; font-weight:bold; letter-spacing:2px; font-size:1.5rem;">${v.tagline||''}</p></div><section style="padding:80px 5%"><div class="container"><div class="row"><div class="col-lg-12 text-center mb-5"><h2 style="color:${content.col_primary}; border-bottom:3px solid ${content.col_accent}; display:inline-block; padding-bottom:10px; margin-bottom:20px; text-align:center;">Business Overview</h2><p class="lead mt-4 mx-auto" style="max-width:800px; text-align:center; font-family:'Open Sans';">${v.overview}</p></div></div><div class="row mt-4">${features}</div></div></section><section style="padding:60px 0; background:#f1f5f9; text-align:center;"><div class="container"><h3>Interested in ${v.title}?</h3><p class="mb-4">Contact us to discuss your requirements.</p><a href="https://wa.me/${content.whatsapp}" class="btn btn-gold">Connect on WhatsApp</a></div></section>${footer}<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"><\/script></body></html>`;
                await uploadToGH(slug, pageHTML);
                await new Promise(r => setTimeout(r, 800));
            }
            alert("Site Updated! Auto-save enabled.");
        } catch(e) { alert("Error: " + e.message); }
    }

    function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
    async function uploadToGH(file, content) {
        const url = `https://api.github.com/repos/${auth.gh_username}/${auth.gh_repo}/contents/${file}`;
        const get = await fetch(url, { headers: { 'Authorization': `token ${auth.gh_token}` }});
        const sha = get.ok ? (await get.json()).sha : null;
        const res = await fetch(url, { method: 'PUT', headers: { 'Authorization': `token ${auth.gh_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Update', content: utf8_to_b64(content), sha: sha }) });
        if(!res.ok) throw new Error("GitHub rejected upload");
    }
    
    async function uploadImage(input, targetID, index) {
        const file = input.files[0]; if(!file || !auth.gh_token) return;
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = async function() {
            const contentBase64 = reader.result.split(',')[1];
            const filename = 'uploads/' + Date.now() + '_' + file.name.replace(/\s/g, '');
            try {
                document.getElementById('status-box').innerText = "Uploading...";
                const url = `https://api.github.com/repos/${auth.gh_username}/${auth.gh_repo}/contents/${filename}`;
                await fetch(url, { method: 'PUT', headers: { 'Authorization': `token ${auth.gh_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ message: `Img`, content: contentBase64 }) });
                const finalUrl = `https://${auth.gh_username}.github.io/${auth.gh_repo}/${filename}`;
                if(targetID.startsWith('v_img')) { content.ventures[index].image = finalUrl; }
                document.getElementById(targetID).value = finalUrl;
                showPreview(targetID, finalUrl);
                saveInternal(true); document.getElementById('status-box').innerText = "Uploaded!";
            } catch(e) { alert('Upload Failed'); }
        };
    }
</script>
