<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willpower Admin v4.0 (Dynamic)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px;}
        
        /* Sidebar */
        .sidebar { width: 260px; height: 100vh; position: fixed; top: 0; left: 0; background: #1a1d21; color: #fff; padding: 20px; overflow-y: auto; z-index: 1000; }
        .sidebar-brand { font-size: 1.2rem; font-weight: bold; padding-bottom: 20px; border-bottom: 1px solid #333; margin-bottom: 20px; color: #c5a059; }
        .nav-btn { display: block; width: 100%; text-align: left; padding: 12px 15px; margin-bottom: 8px; background: transparent; border: none; color: #aaa; border-radius: 6px; transition: 0.2s; }
        .nav-btn:hover { background: #333; color: #fff; }
        .nav-btn.active { background: #c5a059; color: #000; font-weight: 700; }
        
        /* Main */
        .main-content { margin-left: 260px; padding: 40px; max-width: 1000px; }
        .editor-section { display: none; }
        .editor-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Forms */
        .card { border: none; box-shadow: 0 2px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-radius: 10px; }
        .card-header { background: #fff; border-bottom: 1px solid #eee; padding: 15px 20px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 0.8rem; font-weight: 700; color: #555; text-transform: uppercase; margin-top: 15px; display: block; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #dee2e6; border-radius: 5px; }
        
        /* Dynamic Venture Card */
        .venture-item { border-left: 4px solid #c5a059; background: #fff; margin-bottom: 20px; padding: 20px; border-radius: 4px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-remove { position: absolute; top: 15px; right: 15px; color: #dc3545; background: none; border: none; font-size: 1.1rem; }
        .btn-add { background: #1a1d21; color: #c5a059; width: 100%; padding: 15px; border: 2px dashed #c5a059; font-weight: bold; }
        .btn-add:hover { background: #c5a059; color: #000; }

        /* Action Bar */
        .action-bar { position: fixed; bottom: 0; left: 260px; right: 0; background: #fff; padding: 15px 40px; border-top: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; z-index: 900; }
        .btn-publish { background: #052b1e; color: #c5a059; border: none; padding: 10px 30px; font-weight: 700; border-radius: 5px; }
        
        #debug-console { display: none; position: fixed; top: 20px; right: 20px; width: 350px; background: rgba(0,0,0,0.9); color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.75rem; z-index: 2000; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-crown me-2"></i> Willpower v4.0</div>
    <button class="nav-btn active" onclick="showTab('settings')"><i class="fas fa-cog me-2"></i> Setup & Config</button>
    <button class="nav-btn" onclick="showTab('home')"><i class="fas fa-home me-2"></i> Home Page</button>
    <button class="nav-btn" onclick="showTab('ventures')"><i class="fas fa-layer-group me-2"></i> Ventures (Dynamic)</button>
    <button class="nav-btn" onclick="showTab('contact')"><i class="fas fa-address-book me-2"></i> Contact Info</button>
    
    <div style="margin-top: 50px; padding: 20px;">
        <button onclick="logout()" class="btn btn-sm btn-outline-light w-100">Reset / Logout</button>
    </div>
</div>

<div class="main-content">
    
    <div id="settings" class="editor-section active">
        <div class="card">
            <div class="card-header">GitHub Connection (Credentials Saved in Browser)</div>
            <div class="card-body">
                <label>GitHub Username</label><input type="text" id="gh_username">
                <label>Repository Name</label><input type="text" id="gh_repo" value="worldofwillpower">
                <label>GitHub Token</label><input type="password" id="gh_token">
            </div>
        </div>
        <div class="card"><div class="card-body"><label>Google Analytics ID</label><input type="text" id="ga_id"><label>Visitor Start</label><input type="number" id="base_visits" value="1500"></div></div>
    </div>

    <div id="home" class="editor-section">
        <div class="card">
            <div class="card-header">Hero Slider</div>
            <div class="card-body">
                <label>Slide 1 Image</label><input type="text" id="img_hero1">
                <label>Slide 1 Title</label><input type="text" id="hero_h1">
                <label>Slide 1 Subtext</label><textarea id="hero_p1" rows="2"></textarea>
                <hr>
                <label>Slide 2 Image</label><input type="text" id="img_hero2">
                <label>Slide 2 Title</label><input type="text" id="hero_h2">
                <label>Slide 2 Subtext</label><textarea id="hero_p2" rows="2"></textarea>
            </div>
        </div>
        <div class="card"><div class="card-body"><label>About Text</label><textarea id="about_text" rows="4"></textarea></div></div>
        <div class="card"><div class="card-body"><label>Custom Section Title</label><input type="text" id="cust_title"><label>Custom Content</label><textarea id="cust_text" rows="3"></textarea></div></div>
    </div>

    <div id="ventures" class="editor-section">
        <div class="alert alert-info">
            <strong>How to use:</strong> Click "Add Venture" to create a new card. For features, just type each feature on a <strong>new line</strong>. We will turn them into a list automatically.
        </div>
        <div id="venture-container"></div>
        <button class="btn-add" onclick="addVenture()"><i class="fas fa-plus"></i> ADD NEW VENTURE</button>
    </div>

    <div id="contact" class="editor-section">
        <div class="card">
            <div class="card-header">Footer Details</div>
            <div class="card-body">
                <label>Address</label><input type="text" id="address">
                <label>Email</label><input type="text" id="email">
                <label>WhatsApp</label><input type="text" id="whatsapp">
            </div>
        </div>
    </div>
</div>

<div class="action-bar">
    <div id="status-text" style="color:#052b1e; font-weight:bold;"></div>
    <button class="btn-publish" onclick="publishToGitHub()"><i class="fas fa-rocket me-2"></i> PUBLISH CHANGES</button>
</div>

<div id="debug-console"></div>

<script>
    // --- STATE MANAGEMENT ---
    let state = {
        gh_username: '', gh_repo: 'worldofwillpower', gh_token: '',
        ga_id: '', base_visits: 1500,
        img_hero1: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1600&q=80',
        hero_h1: 'Forging Leaders.', hero_p1: 'Strategic mentorship for visionaries.',
        img_hero2: 'https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=1600&q=80',
        hero_h2: 'Manufacturing Quality.', hero_p2: 'Premium Dairy & Ayurvedic Standards.',
        about_text: 'World of Willpower is a diversified conglomerate...',
        cust_title: '', cust_text: '',
        address: '123 Business Park, Pune', email: 'contact@worldofwillpower.com', whatsapp: '919876543210',
        // DYNAMIC VENTURES ARRAY
        ventures: [
            { title: "Mentoring", features: "Leadership Coaching\nPitch Deck Prep\nCrisis Strategy" },
            { title: "Dairy", features: "Cow Ghee\nFresh Paneer\nOrganic Milk" },
            { title: "Trading", features: "Wholesale Network\nImport/Export\nRetail Logistics" }
        ]
    };

    // --- INIT ---
    window.onload = function() {
        const saved = localStorage.getItem('wp_data_v4');
        if(saved) state = { ...state, ...JSON.parse(saved) };
        
        // Populate Standard Fields
        const fields = ['gh_username','gh_repo','gh_token','ga_id','base_visits','img_hero1','hero_h1','hero_p1','img_hero2','hero_h2','hero_p2','about_text','cust_title','cust_text','address','email','whatsapp'];
        fields.forEach(f => { if(document.getElementById(f)) document.getElementById(f).value = state[f] || ''; });

        // Render Ventures
        renderVentures();
    };

    // --- DYNAMIC VENTURE LOGIC ---
    function renderVentures() {
        const container = document.getElementById('venture-container');
        container.innerHTML = '';
        state.ventures.forEach((v, index) => {
            const html = `
            <div class="venture-item">
                <button class="btn-remove" onclick="removeVenture(${index})"><i class="fas fa-trash"></i></button>
                <div class="row">
                    <div class="col-md-4">
                        <label>Venture Title</label>
                        <input type="text" value="${v.title}" oninput="updateVenture(${index}, 'title', this.value)">
                    </div>
                    <div class="col-md-8">
                        <label>Features (One per line)</label>
                        <textarea rows="3" oninput="updateVenture(${index}, 'features', this.value)">${v.features}</textarea>
                    </div>
                </div>
            </div>`;
            container.innerHTML += html;
        });
    }

    function addVenture() {
        state.ventures.push({ title: "New Venture", features: "Feature 1\nFeature 2" });
        renderVentures();
        saveState();
    }

    function removeVenture(index) {
        if(confirm('Delete this venture?')) {
            state.ventures.splice(index, 1);
            renderVentures();
            saveState();
        }
    }

    function updateVenture(index, field, value) {
        state.ventures[index][field] = value;
        saveState();
    }

    // --- CORE FUNCTIONS ---
    function showTab(id) {
        document.querySelectorAll('.editor-section').forEach(e=>e.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
        document.getElementById(id).classList.add('active'); event.currentTarget.classList.add('active');
    }

    function saveState() {
        // Sync Inputs to State
        const fields = ['gh_username','gh_repo','gh_token','ga_id','base_visits','img_hero1','hero_h1','hero_p1','img_hero2','hero_h2','hero_p2','about_text','cust_title','cust_text','address','email','whatsapp'];
        fields.forEach(f => { if(document.getElementById(f)) state[f] = document.getElementById(f).value; });
        
        localStorage.setItem('wp_data_v4', JSON.stringify(state));
        document.getElementById('status-text').innerText = "Autosaved";
    }

    function logout() {
        if(confirm('This will clear your GitHub Token from this browser. Continue?')) {
            localStorage.removeItem('wp_data_v4');
            location.reload();
        }
    }

    function log(msg) {
        const c = document.getElementById('debug-console'); c.style.display='block';
        c.innerHTML = `> ${msg}<br>` + c.innerHTML;
        setTimeout(()=>c.style.display='none', 8000);
    }

    function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }

    // --- PUBLISHER ---
    async function publishToGitHub() {
        saveState();
        if(!state.gh_token) { alert('Please enter GitHub Token in Setup!'); return; }
        document.getElementById('status-text').innerText = "Publishing...";

        // GENERATE VENTURE HTML
        let ventureCardsHTML = '';
        state.ventures.forEach(v => {
            // Convert new lines to <li>
            const listItems = v.features.split('\n').map(f => f.trim() ? `<li><i class="fas fa-check" style="color:#c5a059; margin-right:10px;"></i> ${f}</li>` : '').join('');
            ventureCardsHTML += `
            <div class="col-lg-4 col-md-6">
                <div class="venture-card" style="background:#fff; height:100%; box-shadow:0 10px 30px rgba(0,0,0,0.05); transition:0.3s; border-top:4px solid #c5a059;">
                    <div style="padding:30px;">
                        <h3 style="color:#052b1e; font-family:'Cinzel',serif; margin-bottom:20px;">${v.title}</h3>
                        <ul style="list-style:none; padding:0; line-height:2;">${listItems}</ul>
                    </div>
                </div>
            </div>`;
        });

        const footerHTML = `<footer style="background-color:#052b1e; color:#fff; padding:30px 0; text-align:center;"><div class="container"><div style="background:#052b1e; border:2px solid #c5a059; width:50px; height:50px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; margin-bottom:20px;"><i class="fas fa-crown" style="color:#c5a059; font-size:1.6rem;"></i></div><h4 style="color:#c5a059">World of Willpower</h4><p style="margin-bottom:10px">${state.address}</p><div style="font-size:1.1rem; margin-bottom:20px;"><span style="margin-right:15px"><i class="fab fa-whatsapp" style="color:#25d366"></i> +${state.whatsapp}</span><span><i class="fas fa-envelope" style="color:#f0ad4e"></i> ${state.email}</span></div><div style="font-size:0.8rem; border:1px solid #c5a059; display:inline-block; padding:2px 10px; border-radius:15px; color:#c5a059">Visitors: <span id="visit-count">...</span></div><p class="small mt-3" style="opacity:0.7">&copy; 2025 World of Willpower.</p></div></footer>`;

        const commonStyle = `<style>:root{--primary:#052b1e;--gold:#c5a059}body{font-family:'Manrope',sans-serif;background:#fff;color:#333;overflow-x:hidden}h1,h2,h3,.navbar-brand{font-family:'Cinzel',serif}.navbar{background:var(--primary);padding:15px 0;border-bottom:3px solid var(--gold)}.navbar-brand{color:var(--gold)!important;font-weight:700;font-size:1.4rem;text-transform:uppercase;display:flex;align-items:center}.nav-link{color:rgba(255,255,255,.8)!important;margin-left:15px;text-transform:uppercase;font-size:.85rem}.carousel-item{height:85vh;min-height:500px;background-size:cover;background-position:center}.carousel-caption{bottom:35%}.carousel-caption h1{font-size:3.5rem;color:var(--gold);text-shadow:2px 2px 10px rgba(0,0,0,.5)}.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,.3))}.btn-gold{background:var(--gold);color:var(--primary);padding:15px 40px;font-weight:800;text-decoration:none;display:inline-block;text-transform:uppercase}.float-wa{position:fixed;width:60px;height:60px;bottom:40px;right:40px;background:#25d366;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none; z-index:999}.page-header{background:linear-gradient(to bottom,rgba(0,0,0,.7),rgba(0,0,0,.7)),url('${state.img_hero2}');padding:150px 0 80px 0;text-align:center;color:white}.page-header h1{color:var(--gold);font-size:3.5rem}</style>`;

        // PAGE 1: INDEX
        const indexHTML = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>World of Willpower</title><script async src="https://www.googletagmanager.com/gtag/js?id=${state.ga_id}"><\/script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','${state.ga_id}');<\/script><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">${commonStyle}</head><body><nav class="navbar navbar-expand-lg navbar-dark fixed-top"><div class="container"><a class="navbar-brand" href="index.html">World of Willpower</a><div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="ventures.html">Our Ventures</a></li><li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li></ul></div></div></nav><div class="carousel slide carousel-fade" data-bs-ride="carousel"><div class="carousel-inner"><div class="carousel-item active" style="background-image:url('${state.img_hero1}')"><div class="overlay"></div><div class="carousel-caption" data-aos="fade-up"><h1>${state.hero_h1}</h1><p class="lead text-white mb-5">${state.hero_p1}</p><a href="ventures.html" class="btn-gold">Explore</a></div></div><div class="carousel-item" style="background-image:url('${state.img_hero2}')"><div class="overlay"></div><div class="carousel-caption"><h1>${state.hero_h2}</h1><p class="lead text-white mb-5">${state.hero_p2}</p><a href="ventures.html" class="btn-gold">Products</a></div></div></div></div><section style="padding:80px 0"><div class="container text-center" data-aos="fade-up"><h2 class="fw-bold text-uppercase mb-4" style="color:var(--primary)">The Ecosystem</h2><p class="lead text-muted" style="max-width:800px;margin:0 auto">${state.about_text}</p></div></section>${state.cust_title ? `<section style="background:#f4f4f4; padding:50px 0; text-align:center;"><h3>${state.cust_title}</h3><p>${state.cust_text}</p></section>` : ''}${footerHTML}<a href="https://wa.me/${state.whatsapp}" class="float-wa" target="_blank"><i class="fab fa-whatsapp"></i></a><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"><\/script><script src="https://unpkg.com/aos@2.3.1/dist/aos.js"><\/script><script>AOS.init({duration:1000,once:true});let v=localStorage.getItem('site_visits')||${state.base_visits};v++;localStorage.setItem('site_visits',v);document.getElementById('visit-count').innerText=v;<\/script></body></html>`;

        // PAGE 2: VENTURES (DYNAMIC)
        const venturesHTML = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ventures | World of Willpower</title><script async src="https://www.googletagmanager.com/gtag/js?id=${state.ga_id}"><\/script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','${state.ga_id}');<\/script><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">${commonStyle}</head><body><nav class="navbar navbar-expand-lg navbar-dark fixed-top"><div class="container"><a class="navbar-brand" href="index.html">World of Willpower</a><div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link active" href="ventures.html">Our Ventures</a></li></ul></div></div></nav><header class="page-header"><div class="container"><h1>Business Verticals</h1><p class="lead">A diversified portfolio.</p></div></header><section style="padding:80px 0"><div class="container"><div class="row g-4">${ventureCardsHTML}</div></div></section>${footerHTML}</body></html>`;

        async function updateFile(filename, content) {
            try {
                const url = `https://api.github.com/repos/${state.gh_username}/${state.gh_repo}/contents/${filename}`;
                log(`Connecting to ${filename}...`);
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${state.gh_token}` }});
                if(!getRes.ok) throw new Error(getRes.status);
                const getData = await getRes.json();
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${state.gh_token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `V4 Update: ${filename}`, content: utf8_to_b64(content), sha: getData.sha })
                });
                if(res.ok) log(filename + " Updated.");
            } catch(e) { log("Error: " + e.message); alert('Error: ' + e.message); }
        }

        await updateFile('index.html', indexHTML);
        await updateFile('ventures.html', venturesHTML);
        document.getElementById('status-text').innerText = "SUCCESS! SITE LIVE.";
    }
</script>
</body>
</html>
