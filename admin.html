<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willpower Command Center v7.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px;}
        .sidebar { width: 260px; height: 100vh; position: fixed; top: 0; left: 0; background: #1a1d21; color: #fff; padding: 20px; overflow-y: auto; z-index: 1000; }
        .sidebar-brand { font-size: 1.2rem; font-weight: bold; padding-bottom: 20px; border-bottom: 1px solid #333; margin-bottom: 20px; color: #c5a059; }
        .nav-btn { display: block; width: 100%; text-align: left; padding: 12px 15px; margin-bottom: 8px; background: transparent; border: none; color: #aaa; border-radius: 6px; transition: 0.2s; }
        .nav-btn:hover { background: #333; color: #fff; }
        .nav-btn.active { background: #c5a059; color: #000; font-weight: 700; }
        .main-content { margin-left: 260px; padding: 40px; max-width: 1000px; }
        .editor-section { display: none; }
        .editor-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { border: none; box-shadow: 0 2px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-radius: 10px; }
        .card-header { background: #fff; border-bottom: 1px solid #eee; padding: 15px 20px; font-weight: 700; }
        label { font-size: 0.8rem; font-weight: 700; color: #555; text-transform: uppercase; margin-top: 15px; display: block; }
        input[type="text"], input[type="number"], input[type="password"], textarea, select { width: 100%; padding: 10px; border: 1px solid #dee2e6; border-radius: 5px; }
        input[type="color"] { height: 50px; padding: 0; border: none; cursor: pointer; }
        .upload-group { display: flex; gap: 10px; align-items: flex-end; }
        .btn-upload { border: 2px dashed #c5a059; color: #c5a059; background: white; padding: 9px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; white-space: nowrap;}
        .action-bar { position: fixed; bottom: 0; left: 260px; right: 0; background: #fff; padding: 15px 40px; border-top: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; z-index: 900; }
        .btn-publish { background: #052b1e; color: #c5a059; border: none; padding: 10px 30px; font-weight: 700; border-radius: 5px; }
        .slide-block { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 15px; }
        .connection-status { padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }
        .status-connected { background-color: #d1e7dd; color: #0f5132; }
        .status-disconnected { background-color: #f8d7da; color: #842029; }
        #debug-console { display: none; position: fixed; top: 20px; right: 20px; width: 350px; background: rgba(0,0,0,0.9); color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.75rem; z-index: 2000; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-crown me-2"></i> Willpower v7.2</div>
    <button class="nav-btn active" onclick="showTab('settings')"><i class="fas fa-cog me-2"></i> 1. Setup</button>
    <button class="nav-btn" onclick="showTab('design')"><i class="fas fa-paint-brush me-2"></i> 2. Brand & Logo</button>
    <button class="nav-btn" onclick="showTab('home')"><i class="fas fa-home me-2"></i> 3. 5-Slide Hero</button>
    <button class="nav-btn" onclick="showTab('ventures')"><i class="fas fa-layer-group me-2"></i> 4. Ventures</button>
    <button class="nav-btn" onclick="showTab('contact')"><i class="fas fa-address-book me-2"></i> 5. Contact</button>
    <div style="margin-top: 50px; padding: 20px;"><button onclick="fullReset()" class="btn btn-sm btn-outline-danger w-100">Logout</button></div>
</div>

<div class="main-content">
    
    <div id="settings" class="editor-section active">
        <div id="auth-status" class="connection-status status-disconnected"><span>Not Connected</span></div>
        <div class="card"><div class="card-header">GitHub Credentials</div><div class="card-body">
            <label>Username</label><input type="text" id="gh_username">
            <label>Repo Name</label><input type="text" id="gh_repo" value="worldofwillpower">
            <label>Token</label><input type="password" id="gh_token">
            <button onclick="saveAuth()" class="btn btn-success mt-3 w-100 fw-bold">CONNECT & REMEMBER</button>
        </div></div>
        <div class="card"><div class="card-body"><label>Analytics ID</label><input type="text" id="ga_id"><label>Visitor Start</label><input type="number" id="base_visits" value="1500"></div></div>
    </div>

    <div id="design" class="editor-section">
        <div class="card"><div class="card-header">Branding Studio</div><div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <label>Company Name Text</label><input type="text" id="brand_name" value="World of Willpower">
                </div>
                <div class="col-md-6">
                    <label>Logo Image (Optional)</label>
                    <div class="upload-group"><input type="text" id="brand_logo_url" placeholder="Upload or Paste Link"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'brand_logo_url')"></div></div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label>Font Style</label>
                    <select id="brand_font">
                        <option value="'Cinzel', serif">Cinzel (Elegant/Corporate)</option>
                        <option value="'Montserrat', sans-serif">Montserrat (Modern/Clean)</option>
                        <option value="'Playfair Display', serif">Playfair (Luxury)</option>
                        <option value="'Roboto', sans-serif">Roboto (Standard)</option>
                        <option value="'Great Vibes', cursive">Great Vibes (Cursive)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Font Size (px)</label>
                    <input type="number" id="brand_size" value="24">
                </div>
                
                <div class="col-md-2">
                    <label>Style</label>
                    <div class="btn-group w-100" role="group">
                        <input type="checkbox" class="btn-check" id="brand_bold" autocomplete="off">
                        <label class="btn btn-outline-dark" for="brand_bold"><strong>B</strong></label>

                        <input type="checkbox" class="btn-check" id="brand_italic" autocomplete="off">
                        <label class="btn btn-outline-dark" for="brand_italic"><em>I</em></label>
                    </div>
                </div>

            </div>
        </div></div>

        <div class="card"><div class="card-header">Colors</div><div class="card-body"><div class="row">
            <div class="col-md-6"><label>Primary Color</label><input type="color" id="col_primary" value="#052b1e"></div>
            <div class="col-md-6"><label>Accent Color</label><input type="color" id="col_accent" value="#c5a059"></div>
        </div></div></div>
    </div>

    <div id="home" class="editor-section">
        <div class="card"><div class="card-header">Hero Slider (Leave empty to hide slide)</div><div class="card-body">
            <div class="slide-block"><h6>Slide 1 (Main)</h6><div class="upload-group"><input type="text" id="img_hero1"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'img_hero1')"></div></div><label>Title</label><input type="text" id="hero_h1"><label>Subtext</label><textarea id="hero_p1" rows="1"></textarea></div>
            <div class="slide-block"><h6>Slide 2</h6><div class="upload-group"><input type="text" id="img_hero2"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'img_hero2')"></div></div><label>Title</label><input type="text" id="hero_h2"><label>Subtext</label><textarea id="hero_p2" rows="1"></textarea></div>
            <div class="slide-block"><h6>Slide 3</h6><div class="upload-group"><input type="text" id="img_hero3"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'img_hero3')"></div></div><label>Title</label><input type="text" id="hero_h3"><label>Subtext</label><textarea id="hero_p3" rows="1"></textarea></div>
            <div class="slide-block"><h6>Slide 4</h6><div class="upload-group"><input type="text" id="img_hero4"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'img_hero4')"></div></div><label>Title</label><input type="text" id="hero_h4"><label>Subtext</label><textarea id="hero_p4" rows="1"></textarea></div>
            <div class="slide-block"><h6>Slide 5</h6><div class="upload-group"><input type="text" id="img_hero5"><div style="position:relative; overflow:hidden;"><button class="btn-upload">Up</button><input type="file" style="position:absolute;left:0;top:0;opacity:0;font-size:50px;cursor:pointer;" onchange="uploadImage(this, 'img_hero5')"></div></div><label>Title</label><input type="text" id="hero_h5"><label>Subtext</label><textarea id="hero_p5" rows="1"></textarea></div>
        </div></div>
        <div class="card"><div class="card-body"><label>About Text</label><textarea id="about_text" rows="4"></textarea></div></div>
        <div class="card"><div class="card-body"><label>Custom Title</label><input type="text" id="cust_title"><label>Custom Content</label><textarea id="cust_text" rows="3"></textarea></div></div>
    </div>

    <div id="ventures" class="editor-section">
        <div id="venture-container"></div>
        <button class="btn-add" onclick="addVenture()"><i class="fas fa-plus"></i> ADD NEW VENTURE</button>
    </div>

    <div id="contact" class="editor-section">
        <div class="card"><div class="card-header">Footer Details</div><div class="card-body">
            <label>Address</label><input type="text" id="address">
            <label>Email</label><input type="text" id="email">
            <label>WhatsApp</label><input type="text" id="whatsapp">
        </div></div>
    </div>
</div>

<div class="action-bar">
    <div id="status-text" style="color:#052b1e; font-weight:bold;"></div>
    <button class="btn-publish" onclick="publishToGitHub()"><i class="fas fa-rocket me-2"></i> PUBLISH CHANGES
