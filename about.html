  <style>

    a{text-decoration:none;color:inherit}

      min-width:260px;
      display:none;
      z-index:40;
    }
    .nav-dropdown:hover .nav-dropdown-menu{display:block;}
    .nav-dropdown-item{
      display:block;
      padding:9px 18px;
      border-bottom:1px solid rgba(15,23,42,0.7);
      font-size:13px;
      text-transform:none;
      letter-spacing:0;
      color:#e5e7eb;
    }
    .nav-dropdown-item:last-child{border-bottom:none;}
    .nav-dropdown-item span:first-child{font-weight:600;display:block;}
    .nav-dropdown-item span:last-child{
      font-size:11px;color:#9ca3af;display:block;margin-top:2px;
    }
    .nav-dropdown-item:hover{
      background:#020814;
      color:var(--accent);
    }
